[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pleos-client"
version = "0.1.0"
description = "Async Python client for the Pleos personal Vehicle Data API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jordan Harrison"}]
dependencies = ["aiohttp>=3.9.5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/jouwdan/pleos-client"
Issues = "https://github.com/jouwdan/pleos-client/issues"
Changelog = "https://github.com/jouwdan/pleos-client/releases"

[project.optional-dependencies]
dev = ["build>=1", "coverage>=7", "mypy>=1.10", "ruff>=0.11", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pleos_client = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["pleos_client"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
